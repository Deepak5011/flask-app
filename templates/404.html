{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h1 class="display-1">404</h1>
            <h2 class="mb-4">Page Not Found</h2>
            <p class="lead mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <div class="mb-4">
                <p>Redirecting to home page in <span id="countdown">3</span> seconds...</p>
            </div>
            <a href="{{ url_for('index') }}" class="btn btn-primary">Go to Home Page</a>
        </div>
    </div>
</div>

<script>
    // Countdown and redirect functionality
    let seconds = 3;
    const countdownElement = document.getElementById('countdown');
    
    const countdown = setInterval(() => {
        seconds--;
        countdownElement.textContent = seconds;
        
        if (seconds <= 0) {
            clearInterval(countdown);
            window.location.href = "{{ url_for('index') }}";
        }
    }, 1000);
</script>
{% endblock %}
